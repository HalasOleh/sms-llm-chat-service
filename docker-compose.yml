# Local database for development. A developer tool, not a deployment config.

services:
  postgres:
    image: postgres:16-alpine
    container_name: sms-llm-chat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
      POSTGRES_DB: sms_llm_chat
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sms -d sms_llm_chat']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
